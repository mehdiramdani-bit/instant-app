<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>INSTANT</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22white%22><path d=%22M13 2L3 14h9l-1 8 10-12h-9l1-8z%22/></svg>">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
    }

    /* STORIES PROGRESS BAR */
    .snap-progress-bar {
      position: fixed;
      top: calc(env(safe-area-inset-top, 24px) + 8px);
      left: 24px;
      right: 24px;
      display: flex;
      gap: 5px;
      z-index: 40;
      pointer-events: none;
    }
    .snap-segment {
      flex: 1;
      height: 2px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .snap-segment-fill {
      width: 0%;
      height: 100%;
      background: #FFFFFF;
      border-radius: 2px;
      transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .snap-segment.passed .snap-segment-fill {
      width: 100%;
      background: rgba(255, 255, 255, 0.85);
    }
    .snap-segment.active .snap-segment-fill {
      width: 100%;
      background: #FFFFFF;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
    }

    /* HEADER */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: calc(env(safe-area-inset-top, 24px) + 24px) 32px 0;
      z-index: 30;
      pointer-events: none;
    }
    .logo {
      font-size: 0.89rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #FFFFFF;
      pointer-events: auto;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }
    .lang-toggle {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.83rem;
      font-weight: 600;
    }
    .lang-btn {
      background: none;
      border: none;
      color: #555555;
      font-weight: 700;
      font-size: 0.77rem;
      cursor: pointer;
      padding: 2px 3px;
      transition: color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .lang-btn.active {
      color: #FFFFFF;
    }
    .lang-sep {
      color: #333333;
      font-size: 0.77rem;
    }
    .info-btn {
      background: none;
      border: none;
      color: #777777;
      font-size: 0.77rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform: translateY(-0.5px);
      transition: color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .info-btn:hover {
      color: #FFFFFF;
    }

    /* DECK SCROLL */
    .deck {
      height: 100vh;
      height: 100dvh;
      overflow-y: scroll;
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .deck::-webkit-scrollbar {
      display: none;
    }

    /* SLIDES */
    .slide {
      height: 100vh;
      height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      text-align: left;
      padding: 40px 32px;
      padding-left: clamp(80px, 24vw, 380px);
      box-sizing: border-box;
      position: relative;
    }

    .slide[data-theme="general"] {
      background-color: #000000;
    }
    .slide[data-theme="politique"] {
      background: radial-gradient(ellipse 75% 65% at 38% 50%, #201308 0%, #0f0803 55%, #000000 100%);
    }
    .slide[data-theme="eco"] {
      background: radial-gradient(ellipse 75% 65% at 38% 50%, #061e13 0%, #030d08 55%, #000000 100%);
    }
    .slide[data-theme="tech"] {
      background: radial-gradient(ellipse 75% 65% at 38% 50%, #081729 0%, #040c14 55%, #000000 100%);
    }
    .slide[data-theme="sciences"] {
      background: radial-gradient(ellipse 75% 65% at 38% 50%, #181e09 0%, #0a0d04 55%, #000000 100%);
    }

    .headline {
      font-size: clamp(1.95rem, 4.15vw, 3.35rem);
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.01em;
      margin-bottom: 34px;
      max-width: 900px;
      word-wrap: break-word;
      text-align: left;
      color: #FFFFFF;
    }
    .source-link {
      color: #FFFFFF;
      text-decoration: underline;
      text-decoration-color: rgba(255, 255, 255, 0.35);
      text-underline-offset: 4px;
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      transition: text-decoration-color 0.2s ease, opacity 0.2s ease;
      display: inline-block;
    }
    .source-link:hover {
      text-decoration-color: #FFFFFF;
      opacity: 0.7;
    }

    /* FOOTER */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding-bottom: calc(env(safe-area-inset-bottom, 24px) + 20px);
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 30;
    }

    .footer-category {
      color: rgba(255, 255, 255, 0.45);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: center;
    }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
      cursor: pointer;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: rgba(22, 22, 24, 0.98);
      color: #FFFFFF;
      border-radius: 20px;
      padding: 22px 24px 20px;
      max-width: 290px;
      width: 100%;
      position: relative;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: default;
    }
    .modal-role {
      font-size: 0.69rem;
      font-weight: 600;
      color: #8E8E93;
      margin: 0 0 2px 0;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      line-height: 1.2;
    }
    .modal-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .modal-links a {
      color: #E5E5E7;
      text-decoration: none;
      font-size: 0.87rem;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .modal-links a:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.18);
    }

    @media screen and (max-width: 768px) {
      .snap-progress-bar {
        left: 18px;
        right: 18px;
      }
      .slide {
        padding-left: 24px;
        padding-right: 32px;
      }
      .headline {
        font-size: clamp(1.65rem, 5.45vw, 1.95rem);
        line-height: 1.22;
        max-width: 100%;
        margin-bottom: 24px;
      }
      .source-link {
        font-size: 0.85rem;
      }
    }
  </style>
  <script defer src="[https://cloud.umami.is/script.js](https://cloud.umami.is/script.js)" data-website-id="5c5643bb-e30f-4d00-baf6-71cff4e179fc"></script>
</head>
<body>

  <div class="snap-progress-bar" id="snap-bar">
    <div class="snap-segment"><div class="snap-segment-fill"></div></div>
    <div class="snap-segment"><div class="snap-segment-fill"></div></div>
    <div class="snap-segment"><div class="snap-segment-fill"></div></div>
    <div class="snap-segment"><div class="snap-segment-fill"></div></div>
    <div class="snap-segment"><div class="snap-segment-fill"></div></div>
  </div>

  <header>
    <div class="logo">INSTANT</div>
    <div class="header-right">
      <div class="lang-toggle">
        <button id="btn-fr" class="lang-btn active" onclick="setLang('FR')">FR</button>
        <span class="lang-sep">|</span>
        <button id="btn-us" class="lang-btn" onclick="setLang('US')">US</button>
      </div>
      <button class="info-btn" aria-label="À propos" onclick="openModal()">⃳</button>
    </div>
  </header>

  <main class="deck" id="deck"></main>

  <footer>
    <span class="footer-category" id="footer-category">Général</span>
  </footer>

  <div id="info-modal" class="modal-overlay" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div id="modal-content-fr">
        <div style="display: inline-flex; align-items: baseline; gap: 6px; margin-bottom: 12px;">
          <span style="font-size: 0.95rem; font-weight: 600; letter-spacing: 0.04em; color: #FFFFFF;">INSTANT</span>
          <span style="font-size: 0.75rem; font-weight: 400; color: #FFFFFF; letter-spacing: 0.02em;">v. 2.0</span>
        </div>
        <p class="modal-role">Conception et développement</p>
        <p style="font-size: 0.75rem; font-weight: 500; color: #FFFFFF; margin: 0 0 16px 0; letter-spacing: 0.02em;">Mehdi Ramdani</p>
        <div class="modal-links">
          <a href="[https://www.linkedin.com/in/mehdiramdani/](https://www.linkedin.com/in/mehdiramdani/)" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
          <a href="[https://github.com/mehdiramdani-bit](https://github.com/mehdiramdani-bit)" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
        </div>
      </div>
      <div id="modal-content-us" style="display: none;">
        <div style="display: inline-flex; align-items: baseline; gap: 6px; margin-bottom: 12px;">
          <span style="font-size: 0.95rem; font-weight: 600; letter-spacing: 0.04em; color: #FFFFFF;">INSTANT</span>
          <span style="font-size: 0.75rem; font-weight: 400; color: #FFFFFF; letter-spacing: 0.02em;">v. 2.0</span>
        </div>
        <p class="modal-role">Design & Development</p>
        <p style="font-size: 0.75rem; font-weight: 500; color: #FFFFFF; margin: 0 0 16px 0; letter-spacing: 0.02em;">Mehdi Ramdani</p>
        <div class="modal-links">
          <a href="[https://www.linkedin.com/in/mehdiramdani/](https://www.linkedin.com/in/mehdiramdani/)" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
          <a href="[https://github.com/mehdiramdani-bit](https://github.com/mehdiramdani-bit)" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CATEGORIES = [
      { key: "general", label_fr: "Général", label_us: "General" },
      { key: "politique", label_fr: "Politique", label_us: "Politics" },
      { key: "eco", label_fr: "Ãconomie", label_us: "Economy" },
      { key: "tech", label_fr: "Tech & IA", label_us: "Tech & AI" },
      { key: "sciences", label_fr: "Planète et sciences", label_us: "Planet & Science" }
    ];

    let newsData = { "FR": [], "US": [] };
    let currentLang = 'FR';
    let activeIndex = 0;

    async function loadData() {
      try {
        const res = await fetch('news_categories.json?t=' + Date.now());
        if (res.ok) {
          newsData = await res.json();
        }
      } catch (e) {
        console.warn('Erreur chargement news_categories.json', e);
      }
      renderDeck();
    }

    function renderDeck() {
      const deck = document.getElementById('deck');
      const items = (newsData[currentLang] && newsData[currentLang].length) ? newsData[currentLang] : [];

      deck.innerHTML = '';

      CATEGORIES.forEach((cat, index) => {
        const item = items[index] || { headline: "Actualité en cours de génération…", url: "#", source: "" };
        const slide = document.createElement('section');
        slide.className = 'slide';
        slide.setAttribute('data-theme', cat.key);
        
        const cleanHeadline = (item.headline || '').replace(/'/g, "'");
        const sourceText = (currentLang === 'FR') ? "Lire l'article original \u2197" : "Read the original article \u2197";
        const urlAttr = (item.url && item.url !== '#') ? `href="${item.url}" target="_blank" rel="noopener noreferrer"` : 'style="opacity:0.3;pointer-events:none;"';

        slide.innerHTML = `
          <h1 class="headline">${cleanHeadline}</h1>
          <a class="source-link" ${urlAttr}>
            <span>${sourceText}</span>
          </a>
        `;
        deck.appendChild(slide);
      });

      document.getElementById('btn-fr').classList.toggle('active', currentLang === 'FR');
      document.getElementById('btn-us').classList.toggle('active', currentLang === 'US');

      updateState(0);
      deck.scrollTo({ top: 0, behavior: 'instant' });
      initObserver();
    }

    function updateState(index) {
      activeIndex = index;
      const label = currentLang === 'FR' ? CATEGORIES[index].label_fr : CATEGORIES[index].label_us;
      document.getElementById('footer-category').textContent = label;

      const segments = document.querySelectorAll('.snap-segment');
      segments.forEach((seg, i) => {
        seg.classList.remove('active', 'passed');
        if (i < index) {
          seg.classList.add('passed');
        } else if (i === index) {
          seg.classList.add('active');
        }
      });
    }

    function initObserver() {
      const slides = document.querySelectorAll('.slide');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const index = Array.from(slides).indexOf(entry.target);
            if (index !== -1 && index !== activeIndex) {
              updateState(index);
            }
          }
        });
      }, { root: document.getElementById('deck'), threshold: 0.6 });

      slides.forEach(slide => observer.observe(slide));
    }

    function setLang(lang) {
      if (currentLang === lang) return;
      currentLang = lang;
      renderDeck();
    }

    function nextSlide() {
      const nextIndex = (activeIndex + 1) % CATEGORIES.length;
      const deck = document.getElementById('deck');
      deck.scrollTo({
        top: nextIndex * window.innerHeight,
        behavior: 'smooth'
      });
    }

    // Gestion du Clic Desktop & Tap Mobile
    (function() {
      let touchStartX = 0, touchStartY = 0, touchStartTime = 0;

      document.getElementById('deck').addEventListener('click', (e) => {
        if (e.target.closest('a') || e.target.closest('button') || e.target.closest('.modal-card')) return;
        nextSlide();
      });

      document.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
        touchStartTime = Date.now();
      }, { passive: true });

      document.addEventListener('touchend', (e) => {
        const deltaX = e.changedTouches[0].screenX - touchStartX;
        const deltaY = e.changedTouches[0].screenY - touchStartY;
        const deltaTime = Date.now() - touchStartTime;

        if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 50) {
          setLang(deltaX < 0 ? 'US' : 'FR');
          return;
        }

        if (Math.abs(deltaX) < 10 && Math.abs(deltaY) < 10 && deltaTime < 300) {
          if (e.target.closest('a') || e.target.closest('button') || e.target.closest('.modal-card') || document.getElementById('info-modal').classList.contains('active')) return;
          nextSlide();
        }
      }, { passive: true });
    })();

    function openModal() {
      const isUS = (currentLang === 'US');
      document.getElementById('modal-content-fr').style.display = isUS ? 'none' : 'block';
      document.getElementById('modal-content-us').style.display = isUS ? 'block' : 'none';
      document.getElementById('info-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('info-modal').classList.remove('active');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    loadData();
  </script>
</body>
</html>
