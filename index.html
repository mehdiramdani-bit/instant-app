<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="30">
  <title>Instant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background-color: #0d0d0d;
      color: #f5f5f7;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
      padding: 3rem 2rem;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      color: #86868b;
      text-transform: uppercase;
    }
    .brand { font-weight: 700; color: #fff; }
    
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .lang-picker {
      display: flex;
      gap: 6px;
      font-weight: 600;
    }
    .lang-btn {
      background: none;
      border: none;
      color: #424245;
      font-size: 0.8rem;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .lang-btn.active {
      color: #ffffff;
      border-bottom: 1px solid #ffffff;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 700px;
      margin: 0 auto;
      width: 100%;
    }
    .headline {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.02em;
      margin-bottom: 2.5rem;
    }
    .cta {
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      border-bottom: 1px solid #424245;
      padding-bottom: 4px;
      width: fit-content;
      transition: border-color 0.2s ease;
    }
    .cta:hover { border-color: #fff; }

    footer {
      text-align: center;
      font-size: 0.8rem;
      color: #424245;
    }
    footer a {
      color: #424245;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    footer a:hover {
      color: #86868b;
    }
  </style>

  <script id="news-data" type="application/json">
  {"time": "--:--", "FR": {"headline": "Chargement...", "url": "#"}, "US": {"headline": "Loading...", "url": "#"}}
  </script>
</head>
<body>

  <header>
    <span class="brand">INSTANT</span>
    <div class="header-right">
      <div class="lang-picker">
        <button class="lang-btn active" id="btn-fr" onclick="switchLang('FR')">FR</button>
        <button class="lang-btn" id="btn-us" onclick="switchLang('US')">US</button>
      </div>
      <span id="time-indicator">--:--</span>
    </div>
  </header>

  <main>
    <h1 class="headline" id="headline">Chargement de l'actualité...</h1>
    <a href="https://news.google.com" id="source-link" class="cta" target="_blank">Voir la source ↗</a>
  </main>

  <footer>
    <span id="footer-text">Une seule info à connaître, toutes les 30 minutes.</span> · 
    <a href="https://www.linkedin.com/in/mehdiramdani/" target="_blank">Mehdi Ramdani</a>
  </footer>

  <script>
    let currentLang = localStorage.getItem('instant_lang') || 'FR';

    function getFormattedTime(timeStr, lang) {
      if (!timeStr || timeStr === "--:--") return "--:--";
      
      // Convertir HH:MM en heure locale du visiteur
      const parts = timeStr.split(':');
      if (parts.length === 2) {
        const now = new Date();
        now.setHours(parseInt(parts[0], 10));
        now.setMinutes(parseInt(parts[1], 10));

        if (lang === 'US') {
          // Format heure locale US (ex: UPDATED 2:30 PM ou 14:30 selon paramètres système)
          const localTime = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
          return `UPDATED ${localTime}`;
        } else {
          // Format heure locale FR (ex: MÀJ 14:30)
          const localTime = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', hour12: false });
          return `MÀJ ${localTime}`;
        }
      }
      return lang === 'US' ? `UPDATED ${timeStr}` : `MÀJ ${timeStr}`;
    }

    function renderNews() {
      try {
        const rawData = document.getElementById('news-data').textContent;
        const data = JSON.parse(rawData);

        // Mise à jour de l'indicateur d'heure selon la langue et le fuseau local
        document.getElementById('time-indicator').textContent = getFormattedTime(data.time, currentLang);

        if (currentLang === 'US') {
          document.getElementById('source-link').textContent = "View source ↗";
          document.getElementById('footer-text').textContent = "The single story you need to know, every 30 minutes.";
          document.getElementById('btn-us').classList.add('active');
          document.getElementById('btn-fr').classList.remove('active');
        } else {
          document.getElementById('source-link').textContent = "Voir la source ↗";
          document.getElementById('footer-text').textContent = "Une seule info à connaître, toutes les 30 minutes.";
          document.getElementById('btn-fr').classList.add('active');
          document.getElementById('btn-us').classList.remove('active');
        }

        const item = data[currentLang] || data['FR'];
        if (item && item.headline && item.headline !== "Chargement..." && item.headline !== "Loading...") {
          document.getElementById('headline').textContent = item.headline;
          document.getElementById('source-link').href = item.url;
        }
      } catch (e) {
        console.error("Erreur lors de l'affichage :", e);
      }
    }

    function switchLang(lang) {
      currentLang = lang;
      localStorage.setItem('instant_lang', lang);
      renderNews();
    }

    window.onload = renderNews;
  </script>

</body>
</html>
