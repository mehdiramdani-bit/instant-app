<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>INSTANT</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 24px) + 16px) 32px calc(env(safe-area-inset-bottom, 24px) + 20px);
      user-select: none;
      -webkit-user-select: none;
    }

    /* HEADER : Pleine largeur (Gauche / Droite) */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .logo {
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #FFFFFF;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .lang-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .lang-btn {
      background: none;
      border: none;
      color: #555555;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 2px 4px;
      transition: color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .lang-btn.active {
      color: #FFFFFF;
    }
    .lang-sep {
      color: #333333;
      font-size: 0.75rem;
    }
    .info-btn {
      background: none;
      border: none;
      color: #777777;
      font-size: 1.15rem;
      cursor: pointer;
      padding: 2px 4px;
      line-height: 1;
      transition: color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .info-btn:hover {
      color: #FFFFFF;
    }

    /* CONTENU PRINCIPAL */
    main {
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      text-align: left;
      flex: 1;
      padding: 40px 0;
      box-sizing: border-box;
      padding-left: clamp(80px, 22vw, 360px);
    }
    @media (max-width: 768px) {
      main {
        padding-left: 0;
      }
    }
    .headline {
      font-size: clamp(2.1rem, 5.2vw, 4.3rem);
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.01em;
      margin-bottom: 34px;
      max-width: 780px;
      word-wrap: break-word;
      text-align: left;
    }
    .source-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
      border-bottom: 1px solid #FFFFFF;
      padding-bottom: 3px;
      transition: opacity 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .source-link:hover {
      opacity: 0.7;
    }

    /* FOOTER : Centré */
    footer {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #555555;
      font-size: 0.85rem;
      text-align: center;
    }

    /* MODAL A PROPOS (Ultra-Clean & Symétrique) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
      cursor: pointer;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: rgba(22, 22, 24, 0.98);
      color: #FFFFFF;
      border-radius: 22px;
      padding: 26px 28px 24px;
      max-width: 320px;
      width: 100%;
      position: relative;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: default;
    }
    .modal-role {
      font-size: 0.68rem;
      font-weight: 600;
      color: #8E8E93;
      margin: 0 0 6px 0;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      line-height: 1.2;
    }
    .modal-author {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 18px 0;
      letter-spacing: -0.02em;
      color: #FFFFFF;
      line-height: 1.2;
    }
    .modal-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .modal-links a {
      color: #E5E5E7;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 7px 15px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .modal-links a:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.18);
    }
  </style>
</head>
<body>

  <script id="news-data" type="application/json">
  {"time": "12:00", "FR": {"headline": "L'actualité majeure est en cours d'analyse...", "url": "https://news.google.fr"}, "US": {"headline": "Major news is currently being analyzed...", "url": "https://news.google.com"}}
  </script>

  <header>
    <div class="logo">INSTANT</div>
    <div class="header-right">
      <div class="lang-toggle">
        <button id="btn-fr" class="lang-btn active" onclick="setLang('FR')">FR</button>
        <span class="lang-sep">|</span>
        <button id="btn-us" class="lang-btn" onclick="setLang('US')">US</button>
      </div>
      <button class="info-btn" aria-label="À propos" onclick="openModal()">ⓘ</button>
    </div>
  </header>

  <main>
    <h1 id="headline" class="headline">...</h1>
    <a id="source-link" class="source-link" href="#" target="_blank" rel="noopener noreferrer">
      <span id="source-label">Voir la source</span> ↗
    </a>
  </main>

  <footer>
    <div id="footer-tagline">La seule info qui compte en ce moment.</div>
  </footer>

  <!-- Modal A Propos -->
  <div id="info-modal" class="modal-overlay" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div id="modal-content-fr">
        <p class="modal-role">Conception & développement</p>
        <p class="modal-author">Mehdi Ramdani</p>
        <div class="modal-links">
          <a href="https://www.linkedin.com/in/mehdiramdani/" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
          <a href="https://github.com/mehdiramdani-bit" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
        </div>
      </div>
      <div id="modal-content-us" style="display: none;">
        <p class="modal-role">Design & Development</p>
        <p class="modal-author">Mehdi Ramdani</p>
        <div class="modal-links">
          <a href="https://www.linkedin.com/in/mehdiramdani/" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
          <a href="https://github.com/mehdiramdani-bit" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
        </div>
      </div>
    </div>
  </div>
  </div>

  <script>
    let currentLang = 'FR';
    let newsData = {};

    function initNews() {
      try {
        const raw = document.getElementById('news-data').textContent;
        newsData = JSON.parse(raw);
      } catch (e) {
        newsData = {
          FR: { headline: "Information indisponible", url: "#" },
          US: { headline: "News unavailable", url: "#" }
        };
      }
      render();
    }

    function setLang(lang) {
      currentLang = lang;
      render();
    }

    function render() {
      const item = newsData[currentLang] || { headline: "...", url: "#" };
      document.getElementById('headline').textContent = item.headline;
      document.getElementById('source-link').href = item.url;

      // Tagline dynamique FR/US
      document.getElementById('footer-tagline').textContent = 
        (currentLang === 'FR') ? 'La seule info qui compte en ce moment.' : 'The only news that matters right now.';

      // Boutons Langue
      document.getElementById('btn-fr').classList.toggle('active', currentLang === 'FR');
      document.getElementById('btn-us').classList.toggle('active', currentLang === 'US');
      document.getElementById('source-label').textContent = (currentLang === 'FR') ? 'Voir la source' : 'Read source';
    }

    function openModal() {
      const isUS = (currentLang === 'US');
      document.getElementById('modal-content-fr').style.display = isUS ? 'none' : 'block';
      document.getElementById('modal-content-us').style.display = isUS ? 'block' : 'none';
      document.getElementById('info-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('info-modal').classList.remove('active');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Geste de Swipe Gauche / Droite
    (function() {
      let startX = 0, startY = 0;
      document.addEventListener('touchstart', (e) => {
        startX = e.changedTouches[0].screenX;
        startY = e.changedTouches[0].screenY;
      }, { passive: true });

      document.addEventListener('touchend', (e) => {
        const endX = e.changedTouches[0].screenX;
        const endY = e.changedTouches[0].screenY;
        const deltaX = endX - startX;
        const deltaY = endY - startY;
        if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 50) {
          setLang(deltaX < 0 ? 'US' : 'FR');
        }
      }, { passive: true });
    })();

    // Rafraîchissement iPhone au réveil
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") window.location.reload(true);
    });
    window.addEventListener("pageshow", (e) => {
      if (e.persisted) window.location.reload(true);
    });

    initNews();
  </script>
</body>
</html>
