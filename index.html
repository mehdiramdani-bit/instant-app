<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background-color: #0d0d0d;
      color: #f5f5f7;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
      padding: 3rem 2rem;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      color: #86868b;
      text-transform: uppercase;
    }
    .brand { font-weight: 700; color: #fff; }
    
    .lang-picker {
      display: flex;
      gap: 12px;
      font-weight: 600;
    }
    .lang-btn {
      background: none;
      border: none;
      color: #424245;
      font-size: 0.8rem;
      cursor: pointer;
      transition: color 0.2s ease;
      letter-spacing: 0.1em;
    }
    .lang-btn.active {
      color: #ffffff;
      border-bottom: 1px solid #ffffff;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 700px;
      margin: 0 auto;
      width: 100%;
    }
    .headline {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.02em;
      margin-bottom: 2.5rem;
    }
    .cta {
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      border-bottom: 1px solid #424245;
      padding-bottom: 4px;
      width: fit-content;
      transition: border-color 0.2s ease;
    }
    .cta:hover { border-color: #fff; }

    footer {
      text-align: center;
      font-size: clamp(0.7rem, 2.8vw, 0.8rem);
      color: #424245;
      white-space: nowrap;
    }
    footer a {
      color: #424245;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    footer a:hover {
      color: #86868b;
    }
  </style>

  <script id="news-data" type="application/json">
  {"time": "12:00", "FR": {"headline": "L'actualité majeure est en cours d'analyse...", "url": "https://news.google.fr"}, "US": {"headline": "Major news is currently being analyzed...", "url": "https://news.google.com"}}
  </script>
</head>
<body>

  <header>
    <span class="brand">INSTANT</span>
    <div class="lang-picker">
      <button class="lang-btn active" id="btn-fr" onclick="switchLang('FR')">FR</button>
      <button class="lang-btn" id="btn-us" onclick="switchLang('US')">US</button>
    </div>
  


</header>

  <main>
    <h1 class="headline" id="headline">L'actualité majeure est en cours d'analyse...</h1>
    <a href="https://news.google.fr" id="source-link" class="cta" target="_blank">Voir la source ↗</a>
  </main>

  <footer>
    <span id="footer-text">La seule info qui compte en ce moment.</span> · 
    <a href="https://www.linkedin.com/in/mehdiramdani/" target="_blank">Mehdi Ramdani</a>
  </footer>

  <script>
    let currentLang = localStorage.getItem('instant_lang') || 'FR';

    function renderNews() {
      try {
        const rawData = document.getElementById('news-data').textContent;
        const data = JSON.parse(rawData);

        if (currentLang === 'US') {
          document.getElementById('source-link').textContent = "View source ↗";
          document.getElementById('footer-text').textContent = "The single story that matters right now.";
          document.getElementById('btn-us').classList.add('active');
          document.getElementById('btn-fr').classList.remove('active');
        } else {
          document.getElementById('source-link').textContent = "Voir la source ↗";
          document.getElementById('footer-text').textContent = "La seule info qui compte en ce moment.";
          document.getElementById('btn-fr').classList.add('active');
          document.getElementById('btn-us').classList.remove('active');
        }

        const item = data[currentLang] || data['FR'];
        if (item && item.headline) {
          document.getElementById('headline').textContent = item.headline;
          document.getElementById('source-link').href = item.url;
        }
      } catch (e) {
        console.error("Erreur d'affichage :", e);
      }
    }

    function switchLang(lang) {
      currentLang = lang;
      localStorage.setItem('instant_lang', lang);
      renderNews();
    }

    window.onload = renderNews;
  </script>


<script>
  // Rafraîchissement automatique au réveil sur iOS (PWA / Raccourci)
  document.addEventListener("visibilitychange", function() {
    if (document.visibilityState === "visible") {
      window.location.reload(true);
    }
  });
  window.addEventListener("pageshow", function(e) {
    if (e.persisted) {
      window.location.reload(true);
    }
  });
</script>


<script>
  // Détection du Swipe tactile Gauche / Droite (iOS & Mobile)
  (function() {
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;
    const minDistance = 50; // Seuil minimum en pixels pour valider le swipe

    document.addEventListener('touchstart', function(e) {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    document.addEventListener('touchend', function(e) {
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;

      // On vérifie que le mouvement est principalement horizontal (évite les conflits avec le scroll vertical)
      if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > minDistance) {
        if (deltaX < 0) {
          // Swipe vers la gauche -> Passer à US
          if (typeof setLanguage === 'function') {
            setLanguage('US');
          } else if (typeof switchLang === 'function') {
            switchLang('US');
          }
        } else {
          // Swipe vers la droite -> Passer à FR
          if (typeof setLanguage === 'function') {
            setLanguage('FR');
          } else if (typeof switchLang === 'function') {
            switchLang('FR');
          }
        }
      }
    }
  })();
</script>


<!-- Bouton Info discret -->
<button id="info-btn" aria-label="About" onclick="openModal()">ⓘ</button>

<!-- Modal A Propos -->
<div id="info-modal" class="modal-overlay" onclick="closeModal(event)">

    <button class="modal-close" onclick="closeModal()">×</button>
    <div id="modal-content-fr">
      <p class="modal-role">Conception & développement :</p>
      <p class="modal-author">Mehdi Ramdani</p>
      <div class="modal-links">
        <a href="https://www.linkedin.com/in/mehdiramdani/" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
        <span class="modal-sep">•</span>
        <a href="https://github.com/mehdiramdani-bit" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      </div>
    </div>
    <div id="modal-content-us" style="display: none;">
      <p class="modal-role">Design & Development:</p>
      <p class="modal-author">Mehdi Ramdani</p>
      <div class="modal-links">
        <a href="https://www.linkedin.com/in/mehdiramdani/" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
        <span class="modal-sep">•</span>
        <a href="https://github.com/mehdiramdani-bit" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      </div>
    </div>
  </div>
</div>

<style>
  /* Header / Barre superieure a droite */
  .top-bar, .header, header, .lang-container {
    display: flex !important;
    justify-content: flex-end !important;
    align-items: center !important;
    gap: 8px !important;
  }

  /* Bouton Info integre au groupe */
  #info-btn {
    position: static !important;
    background: transparent;
    border: none;
    color: #8E8E93;
    font-size: 1.15rem;
    cursor: pointer;
    padding: 4px 6px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #info-btn:hover {
    color: #000;
  }
  @media (prefers-color-scheme: dark) {
    #info-btn:hover { color: #FFF; }
  }

  /* Modal Floute iOS */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .modal-overlay.active {
    display: flex;
    opacity: 1;
  }
  .modal-card {
    background: #FFFFFF;
    color: #000000;
    border-radius: 18px;
    padding: 28px 24px 24px;
    max-width: 320px;
    width: 100%;
    position: relative;
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    text-align: center;
    transform: scale(0.95);
    transition: transform 0.2s ease;
  }
  @media (prefers-color-scheme: dark) {
    .modal-card {
      background: #1C1C1E;
      color: #FFFFFF;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
  }
  .modal-overlay.active .modal-card {
    transform: scale(1);
  }
  .modal-close {
    position: absolute;
    top: 12px;
    right: 14px;
    background: transparent;
    border: none;
    font-size: 1.5rem;
    color: #8E8E93;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }
  .modal-role {
    font-size: 0.85rem;
    color: #8E8E93;
    margin: 0 0 6px 0;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .modal-author {
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0 0 16px 0;
    letter-spacing: -0.02em;
  }
  .modal-links {
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .modal-links a {
    color: #0071E3;
    text-decoration: none;
    font-weight: 500;
  }
  .modal-links a:hover {
    text-decoration: underline;
  }
  .modal-sep {
    color: #8E8E93;
    font-size: 0.8rem;
  }
</style>

<script>
  function openModal() {
    const isUS = (typeof currentLang !== 'undefined' && currentLang === 'US');
    document.getElementById('modal-content-fr').style.display = isUS ? 'none' : 'block';
    document.getElementById('modal-content-us').style.display = isUS ? 'block' : 'none';
    const modal = document.getElementById('info-modal');
    modal.classList.add('active');
  }

  function closeModal() {
    const modal = document.getElementById('info-modal');
    modal.classList.remove('active');
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
  });
</script>

</body>
</html>
