<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="refresh" content="30">
  <title>Instant</title>

  <!-- Configuration PWA iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Instant">
  <link rel="apple-touch-icon" href="https://fav.farm/⚡️">
  <link rel="icon" href="https://fav.farm/⚡️">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background-color: #0d0d0d;
      color: #f5f5f7;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
      padding: clamp(2rem, 5vh, 4rem) 2rem;
      -webkit-user-select: none;
    }
    header {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      color: #86868b;
      text-transform: uppercase;
      margin-top: env(safe-area-inset-top); /* Adapte l'encoche de l'iPhone */
    }
    .brand { font-weight: 700; color: #fff; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 700px;
      margin: 0 auto;
    }
    .headline {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.02em;
      margin-bottom: 2.5rem;
    }
    .cta {
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      border-bottom: 1px solid #424245;
      padding-bottom: 4px;
      width: fit-content;
      transition: border-color 0.2s ease;
    }
    .cta:hover { border-color: #fff; }
    footer {
      text-align: center;
      font-size: 0.8rem;
      color: #424245;
      margin-bottom: env(safe-area-inset-bottom);
    }
  </style>
</head>
<body>

  <header>
    <span class="brand">INSTANT</span>
    <span id="time-indicator">Chargement...</span>
  </header>

  <main>
    <h1 class="headline" id="headline">Initialisation de l'application...</h1>
    <a href="https://news.google.com" id="source-link" class="cta" target="_blank">Lire la source ↗</a>
  </main>

  <footer>
    Une seule info clé, toutes les 30 minutes.
  </footer>

</body>
</html>
