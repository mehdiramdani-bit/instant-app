<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background-color: #0d0d0d;
      color: #f5f5f7;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
      padding: 3rem 2rem;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      color: #86868b;
      text-transform: uppercase;
    }
    .brand { font-weight: 700; color: #fff; }
    
    .lang-picker {
      display: flex;
      gap: 12px;
      font-weight: 600;
    }
    .lang-btn {
      background: none;
      border: none;
      color: #424245;
      font-size: 0.8rem;
      cursor: pointer;
      transition: color 0.2s ease;
      letter-spacing: 0.1em;
    }
    .lang-btn.active {
      color: #ffffff;
      border-bottom: 1px solid #ffffff;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 700px;
      margin: 0 auto;
      width: 100%;
    }
    .headline {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.02em;
      margin-bottom: 2.5rem;
    }
    .cta {
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      border-bottom: 1px solid #424245;
      padding-bottom: 4px;
      width: fit-content;
      transition: border-color 0.2s ease;
    }
    .cta:hover { border-color: #fff; }

    footer {
      text-align: center;
      font-size: clamp(0.7rem, 2.8vw, 0.8rem);
      color: #424245;
      white-space: nowrap;
    }
    footer a {
      color: #424245;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    footer a:hover {
      color: #86868b;
    }
  </style>

  <script id="news-data" type="application/json">
  {"time": "12:00", "FR": {"headline": "L'actualité majeure est en cours d'analyse...", "url": "https://news.google.fr"}, "US": {"headline": "Major news is currently being analyzed...", "url": "https://news.google.com"}}
  </script>
</head>
<body>

  <header>
    <span class="brand">INSTANT</span>
    <div class="lang-picker">
      <button class="lang-btn active" id="btn-fr" onclick="switchLang('FR')">FR</button>
      <button class="lang-btn" id="btn-us" onclick="switchLang('US')">US</button>
    </div>
  </header>

  <main>
    <h1 class="headline" id="headline">L'actualité majeure est en cours d'analyse...</h1>
    <a href="https://news.google.fr" id="source-link" class="cta" target="_blank">Voir la source ↗</a>
  </main>

  <footer>
    <span id="footer-text">La seule info qui compte en ce moment.</span> · 
    <a href="https://www.linkedin.com/in/mehdiramdani/" target="_blank">Mehdi Ramdani</a>
  </footer>

  <script>
    let currentLang = localStorage.getItem('instant_lang') || 'FR';

    function renderNews() {
      try {
        const rawData = document.getElementById('news-data').textContent;
        const data = JSON.parse(rawData);

        if (currentLang === 'US') {
          document.getElementById('source-link').textContent = "View source ↗";
          document.getElementById('footer-text').textContent = "The single story that matters right now.";
          document.getElementById('btn-us').classList.add('active');
          document.getElementById('btn-fr').classList.remove('active');
        } else {
          document.getElementById('source-link').textContent = "Voir la source ↗";
          document.getElementById('footer-text').textContent = "La seule info qui compte en ce moment.";
          document.getElementById('btn-fr').classList.add('active');
          document.getElementById('btn-us').classList.remove('active');
        }

        const item = data[currentLang] || data['FR'];
        if (item && item.headline) {
          document.getElementById('headline').textContent = item.headline;
          document.getElementById('source-link').href = item.url;
        }
      } catch (e) {
        console.error("Erreur d'affichage :", e);
      }
    }

    function switchLang(lang) {
      currentLang = lang;
      localStorage.setItem('instant_lang', lang);
      renderNews();
    }

    window.onload = renderNews;
  </script>


<script>
  // Rafraîchissement automatique au réveil sur iOS (PWA / Raccourci)
  document.addEventListener("visibilitychange", function() {
    if (document.visibilityState === "visible") {
      window.location.reload(true);
    }
  });
  window.addEventListener("pageshow", function(e) {
    if (e.persisted) {
      window.location.reload(true);
    }
  });
</script>


<script>
  // Détection du Swipe tactile Gauche / Droite (iOS & Mobile)
  (function() {
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;
    const minDistance = 50; // Seuil minimum en pixels pour valider le swipe

    document.addEventListener('touchstart', function(e) {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    document.addEventListener('touchend', function(e) {
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;

      // On vérifie que le mouvement est principalement horizontal (évite les conflits avec le scroll vertical)
      if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > minDistance) {
        if (deltaX < 0) {
          // Swipe vers la gauche -> Passer à US
          if (typeof setLanguage === 'function') {
            setLanguage('US');
          } else if (typeof switchLang === 'function') {
            switchLang('US');
          }
        } else {
          // Swipe vers la droite -> Passer à FR
          if (typeof setLanguage === 'function') {
            setLanguage('FR');
          } else if (typeof switchLang === 'function') {
            switchLang('FR');
          }
        }
      }
    }
  })();
</script>

</body>
</html>
